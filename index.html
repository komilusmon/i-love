    :root {
      --bg-color: #030005;
      --primary-pink: #ff2a6d;
      --secondary-pink: #ff758c;
      --neon-glow: rgba(255, 42, 109, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient fon nurlari */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 42, 109, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 1;
      transition: all 1s ease;
    }

    /* 1. KIRISH OYNASI */
    #welcome-screen {
      position: fixed;
      inset: 0;
      background: #030005;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s;
      padding: 20px;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 42, 109, 0.25);
      box-shadow: 0 0 40px rgba(255, 42, 109, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 35px 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: floatIn 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .card-icon {
      font-size: 54px;
      margin-bottom: 15px;
      display: inline-block;
      animation: gentleBeat 2s infinite ease-in-out;
    }

    @keyframes gentleBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .welcome-card h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #ff85a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .input-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(20, 10, 25, 0.8);
      border: 1px solid rgba(255, 75, 110, 0.3);
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.3s;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .input-box:focus {
      border-color: var(--primary-pink);
      box-shadow: 0 0 18px var(--neon-glow);
    }

    .btn-glow {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ff1744, #d81159);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 23, 68, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-glow:active {
      transform: scale(0.97);
    }

    /* 2. ASOSIY YURAK ANIMATSIYASI */
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #heart-canvas-box {
      position: relative;
      width: min(90vw, 750px);
      height: min(85vh, 680px);
    }

    .word-item {
      position: absolute;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      white-space: nowrap;
      font-weight: 600;
      cursor: default;
      transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.5s ease;
      will-change: transform, opacity;
      letter-spacing: 0.5px;
    }

    .word-item.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.9;
    }

    /* Oxirgi birlashgan yurak urishi */
    .heart-pulsing {
      animation: bigHeartBeat 1.35s infinite ease-in-out !important;
    }

    @keyframes bigHeartBeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.09); }
      28% { transform: scale(1.02); }
      42% { transform: scale(1.13); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    /* Markazdagi asosiy ism */
    #center-love {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      text-align: center;
      z-index: 50;
      transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      width: 90%;
    }

    #center-love.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .main-name {

      font-size: clamp(38px, 9vw, 68px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 15px #ff2a6d, 0 0 35px #ff1744, 0 0 60px #ff0055;
      line-height: 1.1;
      margin-bottom: 5px;
    }

    .main-subtitle {

      letter-spacing: 3px;
      color: #ffccd5;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 42, 109, 0.8);
    }

    /* Yuqori axborot paneli */
    #hud-bar {

      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      z-index: 40;
      opacity: 0;

    }

    #hud-bar.show { opacity: 1; }

    .progress-text {

      font-weight: 600;
      color: var(--secondary-pink);
    }

    .current-lang {

      color: #fff;
      font-weight: 400;
    }

    /* 3. ADMIN PANEL TUGMASI VA MODALI */

      font-size: 11px;

      pointer-events: none;

      0% { transform: translateY(0) scale(1); opacity: 0.8; }

    // 3. Ovoz sintezatori (Web Audio API - tashqi faylsiz)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playChime(freq = 440) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function playHeartBeatSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(70, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // 4. Kardiroid Yurak koordinatalarini hisoblash
    function generateHeartPoints(total) {
      const points = [];
      const outerCount = Math.floor(total * 0.58); // Tashqi qirrasi
      const innerCount = total - outerCount;       // Ichki to'ldiruvchi qismi

      // Tashqi qirra
      for (let i = 0; i < outerCount; i++) {
        const t = (i / outerCount) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        points.push({ x, y, scale: 1 });
      }

      // Ichki qatlamlar (Yurak ichini to'ldirish)
      const innerScales = [0.78, 0.55, 0.32];
      let allocated = 0;
      innerScales.forEach((scale, layerIdx) => {
        const countThisLayer = Math.floor(innerCount / innerScales.length) + (layerIdx === 0 ? innerCount % innerScales.length : 0);
        for (let i = 0; i < countThisLayer; i++) {
          const t = (i / countThisLayer) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3) * scale;
          const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
          points.push({ x, y, scale });
        }
      });

      // Tasodifiy tartibda chiqishi uchun aralashtiramiz
      return points.sort(() => Math.random() - 0.5);
    }

    // Ranglar palitrasi
    const COLOR_PALETTE = [
      '#ff2a6d', '#ff758c', '#ff5400', '#f72585', 
      '#ff99c8', '#e0aaff', '#ffccd5', '#f3c68f', '#ff4d6d'
    ];

    // 5. Animatsiya boshqaruvi
    const canvasBox = document.getElementById("heart-canvas-box");
    const hudBar = document.getElementById("hud-bar");
    const hudCount = document.getElementById("hud-count");
    const hudLang = document.getElementById("hud-lang");
    const centerLove = document.getElementById("center-love");
    const finalNameEl = document.getElementById("final-name");

    function startHeartAnimation(name) {
      finalNameEl.textContent = name;
      hudBar.classList.add("show");

      const boxWidth = canvasBox.clientWidth;
      const boxHeight = canvasBox.clientHeight;
      const points = generateHeartPoints(LOVE_WORDS.length);

      // Masshtab koeffitsiyenti
      const scaleX = boxWidth / 38;
      const scaleY = boxHeight / 38;

      canvasBox.innerHTML = '';
      const elements = [];

      LOVE_WORDS.forEach((item, index) => {
        const pt = points[index];
        const span = document.createElement("div");
        span.className = "word-item";
        span.textContent = item.text;

        const posX = (boxWidth / 2) + (pt.x * scaleX);
        const posY = (boxHeight / 2) + (pt.y * scaleY);

        span.style.left = `${posX}px`;
        span.style.top = `${posY}px`;

        const randomColor = COLOR_PALETTE[index % COLOR_PALETTE.length];
        span.style.color = randomColor;
        span.style.textShadow = `0 0 10px ${randomColor}aa`;
        
        // O'lchami ekranga qarab
        const fontSize = pt.scale < 0.6 ? 'clamp(9px, 2vw, 12px)' : 'clamp(11px, 2.5vw, 15px)';
        span.style.fontSize = fontSize;

        canvasBox.appendChild(span);
        elements.push({ el: span, data: item });
      });

      // So'zlarni ketma-ket chiqarish
      let currentIndex = 0;
      const intervalTime = 160; // Har bir so'z chiqish tezligi (ms)

      const timer = setInterval(() => {
        if (currentIndex >= elements.length) {
          clearInterval(timer);
          finishAnimation();
          return;
        }

        const current = elements[currentIndex];
        current.el.classList.add("show");
        
        // Progress va til nomi
        hudCount.textContent = `${currentIndex + 1} / ${LOVE_WORDS.length}`;
        hudLang.textContent = `${current.data.lang}: "${current.data.text}"`;

        // Musiqa ohangi (Pentatonik chastotalar)
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        playChime(notes[currentIndex % notes.length]);

        currentIndex++;
      }, intervalTime);

      // Yakuniy yurak urishi va portlash effekti
      function finishAnimation() {
        hudLang.textContent = "Barcha tillarda bitta yurak ❤️";
        centerLove.classList.add("active");

        // Butun yurakni birlashtirib urish
        canvasBox.classList.add("heart-pulsing");

        // Doimiy yurak urish ritmi
        setInterval(() => {
          playHeartBeatSound();
          setTimeout(playHeartBeatSound, 240);
        }, 1350);

        // Uchqun zarralarini chiqarish
        setInterval(createFloatingSparkle, 300);
      }
    }

    function createFloatingSparkle() {
      const sparkle = document.createElement("div");
      sparkle.className = "particle";
      const size = Math.random() * 5 + 3;
      sparkle.style.width = `${size}px`;
      sparkle.style.height = `${size}px`;
      sparkle.style.left = `${Math.random() * window.innerWidth}px`;
      sparkle.style.top = `${window.innerHeight - 20}px`;
      sparkle.style.background = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 3000);
    }

    // 6. Syurprizni ochish (Parolni tekshirish)
    async function checkPasswordAndStart(pass) {
      const errMsg = document.getElementById("err-msg");
      errMsg.style.display = "none";

      if (!pass) {
        errMsg.textContent = "Iltimos, parolni kiriting!";
        errMsg.style.display = "block";
        return;
      }

      try {
        const key = cleanKey(pass);
        const snapshot = await get(ref(db, "secrets/" + key));

        if (snapshot.exists()) {
          const secretData = snapshot.val();
          document.getElementById("welcome-screen").style.opacity = "0";
          setTimeout(() => {
            document.getElementById("welcome-screen").style.display = "none";
          }, 800);
          startHeartAnimation(secretData.name);
        } else {
          errMsg.textContent = "Bunday parol topilmadi! Parolni tekshirib qayta kiriting.";
          errMsg.style.display = "block";
        }
      } catch (e) {
        errMsg.textContent = "Ulanishda xatolik: " + e.message;
        errMsg.style.display = "block";
      }
    }

    document.getElementById("btn-start").addEventListener("click", () => {
      const val = document.getElementById("target-pass").value;
      checkPasswordAndStart(val);
    });

    document.getElementById("target-pass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        checkPasswordAndStart(e.target.value);
      }
    });

    // URL orqali to'g'ridan-to'g'ri ochish (Masalan: sayt.uz/?p=parol)
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const directPass = urlParams.get("p") || urlParams.get("pass");
      if (directPass) {
        document.getElementById("target-pass").value = directPass;
        checkPasswordAndStart(directPass);
      }
      if (window.location.hash === "#admin") {
        openAdminModal();
      }
    });

    // 7. ADMIN PANEL MANTIQI (Juda oson va qulay)
    const adminModal = document.getElementById("admin-modal");
    const adminToggleBtn = document.getElementById("admin-toggle-btn");
    const btnCloseAdmin = document.getElementById("btn-close-admin");
    const btnSaveAdmin = document.getElementById("btn-save-admin");
    const adminAlert = document.getElementById("admin-alert");
    const secretsContainer = document.getElementById("secrets-items-container");

    function openAdminModal() {
      adminModal.style.display = "flex";
      loadSecretsList();
    }

    function closeAdminModal() {
      adminModal.style.display = "none";
    }

    adminToggleBtn.addEventListener("click", openAdminModal);
    btnCloseAdmin.addEventListener("click", closeAdminModal);

    // Bazadagi barcha mavjud parollarni yuklab ko'rsatish
    async function loadSecretsList() {
      try {
        const snap = await get(ref(db, "secrets"));
        if (!snap.exists()) {
          secretsContainer.innerHTML = "<div style='color:#777; font-size:12px;'>Hozircha saqlangan parollar yo'q.</div>";
          return;
        }

        const data = snap.val();
        secretsContainer.innerHTML = "";

        Object.keys(data).forEach(rawKey => {
          const item = data[rawKey];
          const row = document.createElement("div");
          row.className = "secret-row";
          row.innerHTML = `
            <div class="secret-row-info">
              <strong style="color:#ff85a1;">${item.name}</strong>
              <span style="font-size:11px; color:#aaa;">Parol: <code style="color:#fff;">${decodeURIComponent(rawKey)}</code></span>
            </div>
            <div class="secret-actions">
              <button class="btn-action" data-copy="${decodeURIComponent(rawKey)}">📋 Link</button>
              <button class="btn-action" style="background:#ff2a6d44;" data-del="${rawKey}">🗑️</button>
            </div>
          `;

          // Havolani nusxalash
          row.querySelector("[data-copy]").addEventListener("click", () => {
            const currentUrl = window.location.origin + window.location.pathname;
            const fullLink = `${currentUrl}?p=${encodeURIComponent(decodeURIComponent(rawKey))}`;
            navigator.clipboard.writeText(fullLink);
            alert("To'g'ridan-to'g'ri ochiladigan link nusxalandi:\n" + fullLink);
          });

          // O'chirish
          row.querySelector("[data-del]").addEventListener("click", async () => {
            if (confirm(`Rostdan ham "${item.name}" ma'lumotini o'chirmoqchimisiz?`)) {
              await remove(ref(db, "secrets/" + rawKey));
              loadSecretsList();
            }
          });

          secretsContainer.appendChild(row);
        });
      } catch (err) {
        secretsContainer.innerHTML = "<div style='color:#ff4d6d; font-size:12px;'>Xatolik: " + err.message + "</div>";
      }
    }

    // Yangi parol va ism saqlash
    btnSaveAdmin.addEventListener("click", async () => {
      const name = document.getElementById("admin-name").value.trim();
      const pass = document.getElementById("admin-pass").value.trim();

      adminAlert.style.display = "block";

      if (!name || !pass) {
        adminAlert.style.color = "#ff4d6d";
        adminAlert.textContent = "Iltimos, ism va parolni to'liq yozing!";
        return;
      }

      try {
        btnSaveAdmin.textContent = "Saqlanmoqda...";
        btnSaveAdmin.disabled = true;

        const key = cleanKey(pass);
        await set(ref(db, "secrets/" + key), {
          name: name,
          createdDate: new Date().toISOString()
        });

        adminAlert.style.color = "#4ade80";
        adminAlert.textContent = `Muvaffaqiyatli saqlandi! Parol: "${pass}"`;
        document.getElementById("admin-name").value = "";
        document.getElementById("admin-pass").value = "";

        loadSecretsList();
      } catch (e) {
        adminAlert.style.color = "#ff4d6d";
        adminAlert.textContent = "Xatolik: " + e.message;
      } finally {
        btnSaveAdmin.textContent = "Bazaga Saqlash 💾";
        btnSaveAdmin.disabled = false;
      }
    });
  </script>
</body>
</html>
