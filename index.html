<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maxsus Sevgi Syurprizi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #ffe4e6; margin: 0; padding: 0; overflow: hidden; }
    .font-romantic { font-family: 'Dancing Script', cursive; }
    .font-vibes { font-family: 'Great Vibes', cursive; }
    .glass-box { background: rgba(15, 5, 15, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(244, 114, 182, 0.3); }
    @keyframes deepPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(244, 63, 94, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 50px rgba(244, 63, 94, 0.8); transform: scale(1.05); }
    }
    .pulse-glow-btn { animation: deepPulse 2.4s ease-in-out infinite; }
  </style>
</head>
<body class="w-screen h-screen relative bg-black overflow-hidden">

  <!-- Interaktiv Canvas -->
  <canvas id="heartCanvas" class="absolute inset-0 w-full h-full block z-0"></canvas>

  <!-- 1. PAROL KIRITISH OVERLAY -->
  <div id="passwordOverlay" class="absolute inset-0 bg-black z-40 flex flex-col items-center justify-center p-4 text-center">
    <div class="glass-box p-8 rounded-3xl max-w-sm w-full border border-rose-500/30 shadow-[0_0_50px_rgba(244,63,94,0.3)]">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center bg-rose-950/50 border border-rose-500/40 text-rose-400 text-2xl shadow-lg">
        <i class="fa-solid fa-lock animate-pulse"></i>
      </div>
      <h2 class="text-2xl font-vibes text-transparent bg-clip-text bg-gradient-to-r from-pink-300 to-rose-400 mb-2">
        Sizga Maxsus Xabar Bor
      </h2>
      <p class="text-xs text-rose-200/70 mb-6">
        Davom etish uchun sizga berilgan maxsus parolni kiriting:
      </p>

      <input type="text" id="passInput" placeholder="Parolni kiriting..." class="w-full px-4 py-3 rounded-xl bg-pink-950/40 border border-pink-500/40 text-rose-100 placeholder-pink-300/30 text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-rose-400 text-base mb-3">
      
      <p id="errorMsg" class="text-xs text-red-400 hidden mb-3 font-semibold">Parol noto'g'ri! Qayta urinib ko'ring.</p>

      <button id="submitPassBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-rose-600 to-pink-600 text-white font-medium tracking-wider shadow-lg hover:brightness-110 active:scale-95 transition-all">
        Syurprizni Oching <i class="fa-solid fa-heart ml-1"></i>
      </button>

      <!-- Admin Panel Tugmasi -->
      <button id="openAdminBtn" type="button" class="mt-6 text-xs text-rose-300/50 hover:text-rose-300 flex items-center justify-center gap-1.5 mx-auto transition-colors cursor-pointer py-1 px-3 rounded-lg hover:bg-rose-950/30">
        <i class="fa-solid fa-gear text-pink-400"></i> Admin Panel
      </button>
    </div>
  </div>

  <!-- 2. ADMIN PANEL MODAL -->
  <div id="adminModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-box w-full max-w-md p-6 rounded-3xl border border-pink-400/40 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-rose-500/20 pb-3">
        <h3 class="text-lg font-romantic font-bold text-pink-300 flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-rose-400"></i> Admin Panel
        </h3>
        <button id="closeAdminModal" type="button" class="text-gray-400 hover:text-white p-1 text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Admin Kaliti Kirish Qismi -->
      <div id="adminAuthBox" class="space-y-3">
        <p class="text-xs text-rose-200/80">Admin panelga kirish uchun maxsus parolni kiriting (Standart parol: <code class="text-pink-300 bg-pink-950 px-1 rounded">admin123</code>):</p>
        <input type="password" id="adminPassInput" placeholder="Admin kaliti..." class="w-full px-4 py-2.5 rounded-xl bg-pink-950/40 border border-pink-500/40 text-rose-100 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">
        <button id="verifyAdminBtn" type="button" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold transition-all">
          Kirish
        </button>
      </div>

      <!-- Admin Parol Yaratish Formasi -->
      <div id="adminFormBox" class="hidden space-y-3">
        <div>
          <label class="block text-xs text-rose-200/80 mb-1">Qizning ismi (masalan: Bonu):</label>
          <input type="text" id="newGirlName" placeholder="Bonu" class="w-full px-3 py-2 rounded-lg bg-pink-950/40 border border-pink-500/40 text-sm text-rose-100 focus:outline-none focus:ring-1 focus:ring-rose-400">
        </div>
        <div>
          <label class="block text-xs text-rose-200/80 mb-1">Maxsus Izhor (masalan: Bonu, men seni sevaman!):</label>
          <input type="text" id="newMessage" placeholder="Bonu, men seni sevaman!" class="w-full px-3 py-2 rounded-lg bg-pink-950/40 border border-pink-500/40 text-sm text-rose-100 focus:outline-none focus:ring-1 focus:ring-rose-400">
        </div>
        <div>
          <label class="block text-xs text-rose-200/80 mb-1">Sizning ismingiz (masalan: Sizni sevguvchi Komil):</label>
          <input type="text" id="newSenderName" placeholder="Sizni sevguvchi Komil" class="w-full px-3 py-2 rounded-lg bg-pink-950/40 border border-pink-500/40 text-sm text-rose-100 focus:outline-none focus:ring-1 focus:ring-rose-400">
        </div>
        
        <button id="createSurpriseBtn" type="button" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-semibold text-sm hover:brightness-110 transition-all shadow-md mt-2">
          Parol Yaratish va Saqlash
        </button>

        <!-- Yaratilgan Parol Natijasi -->
        <div id="resultBox" class="hidden mt-3 p-3 rounded-xl bg-pink-950/80 border border-pink-400/50 text-xs text-left">
          <p class="text-pink-200 font-bold mb-1 flex items-center gap-1">
            <i class="fa-solid fa-circle-check text-green-400"></i> Muvaffaqiyatli Saqlandi!
          </p>
          <p class="text-gray-300">Qizga yuboriladigan Parol:</p>
          <div class="flex items-center gap-2 mt-1">
            <span id="generatedPass" class="text-rose-300 font-mono text-base font-bold bg-black/60 px-3 py-1 rounded border border-rose-500/30 flex-1 text-center"></span>
            <button id="copyPassBtn" type="button" class="px-3 py-1 rounded bg-rose-800 text-white text-xs hover:bg-rose-700">Nusxalash</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- HUD Progress Header -->
  <header id="topHUD" class="absolute top-4 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-xl text-center pointer-events-none opacity-0 transition-opacity duration-700">
    <div class="glass-box rounded-full px-5 py-2.5 flex items-center justify-between shadow-2xl">
      <div class="flex items-center gap-2">
        <span class="text-rose-400 text-sm animate-pulse"><i class="fa-solid fa-heart-pulse"></i></span>
        <span id="currentLangBadge" class="text-xs sm:text-sm font-romantic font-bold text-pink-200">
          Tayyorlanmoqda...
        </span>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-24 sm:w-36 h-2 bg-rose-950/80 rounded-full overflow-hidden border border-rose-500/30">
          <div id="progressBar" class="h-full bg-gradient-to-r from-pink-500 to-rose-400 w-0 transition-all duration-300"></div>
        </div>
        <span id="progressPercent" class="text-xs font-mono font-bold text-rose-300">0%</span>
      </div>
    </div>
  </header>

  <!-- Control Controls -->
  <footer id="bottomControls" class="absolute bottom-5 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 px-4 py-2 rounded-full glass-box opacity-0 transition-opacity duration-700">
    <button id="soundToggleBtn" type="button" class="px-4 py-2 rounded-full bg-rose-950/40 text-rose-200 border border-rose-500/30 text-xs flex items-center gap-2">
      <i class="fa-solid fa-volume-high text-pink-400" id="soundIcon"></i>
      <span>Ovoz</span>
    </button>
    <button id="replayBtn" type="button" class="px-4 py-2 rounded-full bg-rose-950/40 text-rose-200 border border-rose-500/30 text-xs flex items-center gap-2">
      <i class="fa-solid fa-rotate-left"></i>
      <span>Qayta</span>
    </button>
  </footer>

  <script>
    // Boshlang'ich Namuna Parollar
    const INITIAL_DB = {
      "bonu123": {
        name: "Bonu",
        message: "Bonu, men seni sevaman!",
        sender: "Sizni sevguvchi Komil"
      },
      "sevgilim": {
        name: "Sevgilim",
        message: "Siz mening hayotim mazmunisiz!",
        sender: "Sizni sevadigan insondan"
      }
    };

    function getDatabase() {
      try {
        const stored = localStorage.getItem('love_surprises_db');
        if (!stored) {
          localStorage.setItem('love_surprises_db', JSON.stringify(INITIAL_DB));
          return INITIAL_DB;
        }
        return JSON.parse(stored);
      } catch (e) {
        return INITIAL_DB;
      }
    }

    function saveToDatabase(db) {
      localStorage.setItem('love_surprises_db', JSON.stringify(db));
    }

    // 80 dan ortiq kengaytirilgan tillar ro'yxati
    const UNIQUE_LOVE_TRANSLATIONS = [
      { text: "Men seni sevaman", lang: "O'zbekcha" },
      { text: "I love you", lang: "Inglizcha" },
      { text: "Я тебя люблю", lang: "Ruscha" },
      { text: "Seni seviyorum", lang: "Turkcha" },
      { text: "Je t'aime", lang: "Fransuzcha" },
      { text: "Te amo", lang: "Ispancha" },
      { text: "Ti amo", lang: "Italyancha" },
      { text: "Ich liebe dich", lang: "Nemischa" },
      { text: "愛してる", lang: "Yaponcha" },
      { text: "사랑해", lang: "Koreyscha" },
      { text: "我爱你", lang: "Xitoycha" },
      { text: "أحبك", lang: "Arabcha" },
      { text: "دوستت دارم", lang: "Forscha" },
      { text: "Eu te amo", lang: "Portugalcha" },
      { text: "Σ' αγαπώ", lang: "Yunoncha" },
      { text: "Ik hou van jou", lang: "Gollandcha" },
      { text: "Kocham cię", lang: "Polyakcha" },
      { text: "Jag älskar dig", lang: "Shvedcha" },
      { text: "Jeg elsker deg", lang: "Norvegcha" },
      { text: "Minä rakastan sinua", lang: "Fincha" },
      { text: "Я тебе кохаю", lang: "Ukraincha" },
      { text: "Mən səni sevirəm", lang: "Ozarbayjoncha" },
      { text: "Мен сені сүйемін", lang: "Qozoqcha" },
      { text: "Мен сени сүйөм", lang: "Qirg'izcha" },
      { text: "Ман туро дӯст медорам", lang: "Tojikcha" },
      { text: "Szeretlek", lang: "Vengercha" },
      { text: "Miluji tě", lang: "Chexcha" },
      { text: "Te iubesc", lang: "Rumincha" },
      { text: "Обичам те", lang: "Bolgarcha" },
      { text: "Volim te", lang: "Xorvatcha" },
      { text: "Aku cinta kamu", lang: "Indonezcha" },
      { text: "Anh yêu em", lang: "Vyetnamcha" },
      { text: "ฉันรักเธอ", lang: "Taycha" },
      { text: "Mahal kita", lang: "Filipincha" },
      { text: "მიყვარხარ", lang: "Gruzincha" },
      { text: "Ես քեզ սիրում եմ", lang: "Armancha" },
      { text: "אני אוהב אותך", lang: "Ibroniycha" },
      { text: "T'estimo", lang: "Katalancha" },
      { text: "Aš tave myliu", lang: "Litovcha" },
      { text: "Es tevi mīlu", lang: "Latishcha" },
      { text: "Ma armastan sind", lang: "Estoncha" },
      { text: "Ek het jou lief", lang: "Afrikaans" },
      { text: "Aloha au iā 'oe", lang: "Gavayi" },
      { text: "Ngiyakuthanda", lang: "Zulucha" },
      { text: "Ndiyakuthanda", lang: "Xosacha" },
      { text: "Yuragimning sultoni", lang: "Romantika" },
      { text: "Sen mening borlig'imsan", lang: "Izhor" },
      { text: "Hayotim mazmunisan", lang: "Muhabbat" }
    ];

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, heartScale = 1;
    let currentActiveSurprise = null;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      const minDim = Math.min(width, height);
      heartScale = minDim < 450 ? minDim / 45 : minDim / 40;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Yurak (Cardioid) formulasi
    function getCardioidPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    // So'zlar bir-birining ustiga chiqib qolmasligi uchun tarqoq va tartibli joylar generatsiyasi
    function generateHeartSlots(count, scale) {
      const slots = [];
      const perimeterCount = Math.floor(count * 0.4);
      
      // Chegara bo'ylab joylashuv
      for (let i = 0; i < perimeterCount; i++) {
        const t = (i / perimeterCount) * Math.PI * 2;
        const pt = getCardioidPoint(t, scale);
        slots.push({ x: pt.x * 0.85, y: pt.y * 0.85 });
      }

      // Ichki qismni bir-biriga tegmaydigan qilib to'ldirish
      let attempts = 0;
      while (slots.length < count && attempts < 2000) {
        attempts++;
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * 0.72;
        const edge = getCardioidPoint(t, scale);
        const candX = edge.x * r;
        const candY = edge.y * r;

        let tooClose = false;
        for (let s of slots) {
          if (Math.hypot(s.x - candX, s.y - candY) < scale * 1.3) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) {
          slots.push({ x: candX, y: candY });
        }
      }
      return slots;
    }

    let audioCtx = null, isSoundMuted = false;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playWordChime(index) {
      if (isSoundMuted || !audioCtx) return;
      try {
        const freqs = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freqs[index % freqs.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    class WordEntity {
      constructor(data, slot, index) {
        this.text = data.text;
        this.lang = data.lang;
        this.slotX = slot.x; 
        this.slotY = slot.y;
        this.visible = false;
        this.opacity = 0;
        this.scaleAnim = 0;
        this.fontSize = 10 + Math.random() * 3.5;
        this.hue = 330 + (index * 4) % 30;
      }
      reveal() { 
        this.visible = true; 
      }
      update() { 
        if (this.visible && this.opacity < 1) {
          this.opacity += 0.12;
          this.scaleAnim = Math.min(1, this.scaleAnim + 0.15);
        }
      }
      draw(ctx, centerX, centerY, scale) {
        if (!this.visible) return;
        ctx.save();
        ctx.translate(centerX + this.slotX * scale, centerY + this.slotY * scale);
        ctx.font = `600 ${this.fontSize}px 'Inter', sans-serif`;
        ctx.textAlign = 'center'; 
        ctx.textBaseline = 'middle';
        ctx.fillStyle = `hsla(${this.hue}, 90%, 85%, ${this.opacity})`;
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    const totalWords = UNIQUE_LOVE_TRANSLATIONS.length;
    let wordEntities = [];
    let isCompleted = false, currentRevealIndex = 0, revealTimer = null;

    function initWordEntities() {
      const slots = generateHeartSlots(totalWords, heartScale);
      wordEntities = UNIQUE_LOVE_TRANSLATIONS.map((item, i) => new WordEntity(item, slots[i], i));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const passwordOverlay = document.getElementById('passwordOverlay');
      const passInput = document.getElementById('passInput');
      const submitPassBtn = document.getElementById('submitPassBtn');
      const errorMsg = document.getElementById('errorMsg');

      const adminModal = document.getElementById('adminModal');
      const openAdminBtn = document.getElementById('openAdminBtn');
      const closeAdminModal = document.getElementById('closeAdminModal');
      const verifyAdminBtn = document.getElementById('verifyAdminBtn');
      const adminPassInput = document.getElementById('adminPassInput');
      const adminAuthBox = document.getElementById('adminAuthBox');
      const adminFormBox = document.getElementById('adminFormBox');
      const createSurpriseBtn = document.getElementById('createSurpriseBtn');
      const resultBox = document.getElementById('resultBox');
      const generatedPass = document.getElementById('generatedPass');
      const copyPassBtn = document.getElementById('copyPassBtn');

      openAdminBtn.addEventListener('click', (e) => {
        e.preventDefault();
        adminModal.classList.remove('hidden');
      });

      closeAdminModal.addEventListener('click', () => adminModal.classList.add('hidden'));

      verifyAdminBtn.addEventListener('click', () => {
        if (adminPassInput.value.trim() === 'admin123') {
          adminAuthBox.classList.add('hidden');
          adminFormBox.classList.remove('hidden');
        } else {
          alert('Admin paroli noto\'g\'ri! (Standart: admin123)');
        }
      });

      createSurpriseBtn.addEventListener('click', () => {
        const girlName = document.getElementById('newGirlName').value.trim();
        const message = document.getElementById('newMessage').value.trim();
        const sender = document.getElementById('newSenderName').value.trim();

        if (!girlName || !message) {
          alert('Iltimos, ism va izhorni to\'liq kiriting!');
          return;
        }

        const generatedKey = girlName.toLowerCase().replace(/[^a-z0-9]/g, '') + Math.floor(100 + Math.random() * 900);
        const db = getDatabase();
        db[generatedKey] = { name: girlName, message: message, sender: sender || "Sizni sevguvchi" };
        saveToDatabase(db);

        generatedPass.textContent = generatedKey;
        resultBox.classList.remove('hidden');
      });

      copyPassBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(generatedPass.textContent).then(() => {
          alert('Parol nusxalandi: ' + generatedPass.textContent);
        });
      });

      function checkPasswordAndStart() {
        const pass = passInput.value.trim().toLowerCase();
        const db = getDatabase();

        if (db[pass]) {
          currentActiveSurprise = db[pass];
          passwordOverlay.classList.add('opacity-0');
          setTimeout(() => {
            passwordOverlay.style.display = 'none';
            document.getElementById('topHUD').classList.remove('opacity-0');
            document.getElementById('bottomControls').classList.remove('opacity-0');
            initAudio();
            initWordEntities();
            runNextReveal();
          }, 800);
        } else {
          errorMsg.classList.remove('hidden');
        }
      }

      submitPassBtn.addEventListener('click', checkPasswordAndStart);
      passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPasswordAndStart(); });

      document.getElementById('replayBtn').addEventListener('click', () => {
        if (revealTimer) clearTimeout(revealTimer);
        initWordEntities();
        currentRevealIndex = 0;
        isCompleted = false;
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressPercent').textContent = '0%';
        runNextReveal();
      });
    });

    function runNextReveal() {
      if (currentRevealIndex < wordEntities.length) {
        const item = wordEntities[currentRevealIndex];
        item.reveal();
        document.getElementById('currentLangBadge').textContent = `${item.lang}: "${item.text}"`;
        const pct = Math.round(((currentRevealIndex + 1) / totalWords) * 100);
        document.getElementById('progressBar').style.width = `${pct}%`;
        document.getElementById('progressPercent').textContent = `${pct}%`;

        playWordChime(currentRevealIndex);
        currentRevealIndex++;
        revealTimer = setTimeout(runNextReveal, 280);
      } else {
        isCompleted = true;
        document.getElementById('currentLangBadge').innerHTML = `<span class="text-rose-300 font-bold">YURAK SHAKLLANDI! ❤</span>`;
      }
    }

    let beatTime = 0;
    function renderLoop() {
      ctx.clearRect(0, 0, width, height);
      const centerX = width / 2;
      const centerY = height / 2 - 20;

      let pulse = 1;
      if (isCompleted) {
        beatTime += 0.05;
        pulse = 1 + Math.sin(beatTime * 3) * 0.06;
      }

      wordEntities.forEach(w => {
        w.update();
        w.draw(ctx, centerX, centerY, pulse);
      });

      // Markazdagi Maxsus Izhor
      if (isCompleted && currentActiveSurprise) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const mainSize = Math.max(20, heartScale * 1.4);
        ctx.font = `700 ${mainSize}px 'Dancing Script', cursive`;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(244, 63, 94, 0.95)'; 
        ctx.shadowBlur = 22;
        ctx.fillText(currentActiveSurprise.message, 0, -12);

        const subSize = Math.max(13, heartScale * 0.85);
        ctx.font = `600 ${subSize}px 'Great Vibes', cursive`;
        ctx.fillStyle = '#fecdd3';
        ctx.shadowBlur = 15;
        ctx.fillText(currentActiveSurprise.sender, 0, 22);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    window.onload = () => requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
