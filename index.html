    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let heartScale = 1;
    let partnerName = "";

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      // Cardioid heart proportion based on viewport
      const minDim = Math.min(width, height);
      if (minDim < 450) {
        heartScale = minDim / 44; // Mobile
      } else if (minDim < 768) {
        heartScale = minDim / 40; // Tablet
      } else {
        heartScale = minDim / 38; // Desktop
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /**
     * Cardioid formula:
     * x(t) = 16 * sin^3(t)
     * y(t) = -(13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t))
     */
    function getCardioidPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: x * scale,
        y: y * scale
      };
    }

    /**
     * Pre-calculate well-spaced positions throughout the heart shape
     * So words evenly fill both contour and deep inside without cluttering.
     */
    function generateHeartSlots(count, scale) {
      const slots = [];
      // 1. Boundary & Semi-boundary slots (~45%)
      const perimeterCount = Math.floor(count * 0.45);
      for (let i = 0; i < perimeterCount; i++) {
        const t = (i / perimeterCount) * Math.PI * 2;
        const pt = getCardioidPoint(t, scale);
        // Contract slightly inwards for boundary words
        const factor = 0.88 + Math.random() * 0.12;
        slots.push({
          x: pt.x * factor,
          y: pt.y * factor,
          isPerimeter: true,
          angle: t
        });
      }

      // 2. Interior filled slots (~55%) with rejection spacing
      const interiorCount = count - perimeterCount;
      let attempts = 0;
      while (slots.length < count && attempts < 1500) {
        attempts++;
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * 0.78; // Square root creates uniform density
        const edge = getCardioidPoint(t, scale);
        const candX = edge.x * r;
        const candY = edge.y * r;

        // Ensure minimum clearance between existing slots
        let minDist = 999;
        for (let s of slots) {
          const d = Math.hypot(s.x - candX, s.y - candY);
          if (d < minDist) minDist = d;
        }

        // Adaptive spacing threshold
        if (minDist > scale * 1.5 || attempts > 1000) {
          slots.push({
            x: candX,
            y: candY,
            isPerimeter: false,
            angle: t
          });
        }
      }

      // Shuffle slots so discovery order jumps all across the heart
      for (let i = slots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [slots[i], slots[j]] = [slots[j], slots[i]];
      }

      return slots;
    }

    let audioCtx = null;
    let isSoundMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) {
          audioCtx = new AudioClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Gentle musical bell chime on each word reveal
    function playWordChime(index, total) {
      if (isSoundMuted || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        // Pentatonic harmonic notes progression
        const scaleFreqs = [
          261.63, 293.66, 329.63, 392.00, 440.00, // Octave 4
          523.25, 587.33, 659.25, 783.99, 880.00, // Octave 5
          1046.50                                  // Octave 6
        ];
        const noteIndex = (index * 2) % scaleFreqs.length;
        const freq = scaleFreqs[noteIndex];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = index % 3 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.85);
      } catch (err) {
        // Fallback silently if audio context is blocked
      }
    }

    // Organ-like double heartbeat thump: "Lub - Dub"
    function playThumpSound() {
      if (isSoundMuted || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        // First Beat
        playSingleThump(now, 65, 0.28, 0.4);
        // Second Beat
        playSingleThump(now + 0.20, 80, 0.22, 0.32);
      } catch (e) {}
    }

    function playSingleThump(time, freq, duration, maxGain) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);
      osc.frequency.exponentialRampToValueAtTime(30, time + duration);

      gain.gain.setValueAtTime(maxGain, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(time);
      osc.stop(time + duration);
    }

    class WordEntity {
      constructor(data, slot, index) {
        this.text = data.text;
        this.lang = data.lang;
        this.slotX = slot.x;
        this.slotY = slot.y;
        this.index = index;

        this.visible = false;
        this.revealedAt = 0;
        this.scaleAnim = 0;
        this.opacity = 0;
        this.glow = 0;

        // Distinct romantic hues: Rosy pink, Ruby, Crimson, Peach, Fuchsia
        const hueOptions = [335, 345, 355, 320, 15];
        this.hue = hueOptions[index % hueOptions.length];
        this.fontSize = 11 + (Math.random() * 5); // Responsive font size range
        this.tilt = (Math.random() - 0.5) * 0.22;
      }

      reveal(timestamp) {
        this.visible = true;
        this.revealedAt = timestamp;
      }

      update(timestamp) {
        if (!this.visible) return;
        const elapsed = (timestamp - this.revealedAt) / 1000;

        // Pop in with smooth elastic bounce
        if (elapsed < 0.6) {
          const progress = elapsed / 0.6;
          this.scaleAnim = 1.35 * Math.sin(progress * Math.PI * 0.7);
          this.opacity = Math.min(1, progress * 1.5);
          this.glow = (1 - progress) * 25;
        } else {
          this.scaleAnim = 1;
          this.opacity = 1;
          this.glow = 4;
        }
      }

      draw(ctx, centerX, centerY, globalPulseScale) {
        if (!this.visible || this.opacity <= 0) return;

        ctx.save();
        const posX = centerX + this.slotX * globalPulseScale;
        const posY = centerY + this.slotY * globalPulseScale;

        ctx.translate(posX, posY);
        ctx.rotate(this.tilt);

        const activeSize = this.fontSize * this.scaleAnim * (0.92 + (globalPulseScale - 1) * 1.5);
        ctx.font = `600 ${Math.max(8, activeSize)}px 'Dancing Script', 'Inter', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (this.glow > 2) {
          ctx.shadowColor = `hsla(${this.hue}, 100%, 75%, 0.9)`;
          ctx.shadowBlur = this.glow;
        }

        ctx.fillStyle = `hsla(${this.hue}, 95%, 86%, ${this.opacity})`;
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    class SparkleParticle {
      constructor(x, y, isBig = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = isBig ? (1.5 + Math.random() * 4.5) : (0.5 + Math.random() * 2);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - (isBig ? 1.5 : 0.5);
        this.size = (isBig ? 12 : 7) * (0.6 + Math.random() * 0.8);
        this.life = 1;
        this.decay = 0.015 + Math.random() * 0.025;
        this.color = `hsl(${330 + Math.random() * 45}, 100%, 75%)`;
        this.rotation = Math.random() * Math.PI;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.025;
        this.rotation += 0.04;
        this.life -= this.decay;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;

        // Little Heart Sparkle
        const s = this.size;
        ctx.beginPath();
        ctx.moveTo(0, s * 0.3);
        ctx.bezierCurveTo(-s * 0.5, -s * 0.3, -s, s * 0.2, 0, s);
        ctx.bezierCurveTo(s, s * 0.2, s * 0.5, -s * 0.3, 0, s * 0.3);
        ctx.fill();
        ctx.restore();
      }
    }

    const totalWords = UNIQUE_LOVE_TRANSLATIONS.length;
    let wordEntities = [];
    let sparkles = [];
    let isSurpriseRunning = false;
    let isCompleted = false;
    let currentRevealIndex = 0;
    let revealTimer = null;
    let speedDelay = 380; // Default cadence (~0.38 - 0.4s rhythmic reveal)
    let isFastSpeed = false;

    // Background stardust
    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.8 + 0.5,
      alpha: Math.random() * 0.7 + 0.2,
      speed: Math.random() * 0.02 + 0.01
    }));

    function initWordEntities() {
      const slots = generateHeartSlots(totalWords, heartScale);
      wordEntities = UNIQUE_LOVE_TRANSLATIONS.map((item, index) => {
        return new WordEntity(item, slots[index], index);
      });
    }
    initWordEntities();

    // DOM References
    const introOverlay = document.getElementById('introOverlay');
    const startSurpriseBtn = document.getElementById('startSurpriseBtn');
    const topHUD = document.getElementById('topHUD');
    const bottomControls = document.getElementById('bottomControls');
    const currentLangBadge = document.getElementById('currentLangBadge');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const speedToggleBtn = document.getElementById('speedToggleBtn');
    const speedLabel = document.getElementById('speedLabel');
    const customNameBtn = document.getElementById('customNameBtn');
    const replayBtn = document.getElementById('replayBtn');
    const nameModal = document.getElementById('nameModal');
    const partnerNameInput = document.getElementById('partnerNameInput');
    const savePartnerName = document.getElementById('savePartnerName');
    const clearPartnerName = document.getElementById('clearPartnerName');
    const closeNameModal = document.getElementById('closeNameModal');

    function startSurpriseExperience() {
      initAudio();
      isSurpriseRunning = true;
      currentRevealIndex = 0;
      isCompleted = false;

      // Smoothly hide intro overlay into darkness
      introOverlay.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        introOverlay.style.display = 'none';
        topHUD.classList.remove('opacity-0');
        bottomControls.classList.remove('opacity-0');
      }, 1000);

      runNextReveal();
    }

    function runNextReveal() {
      if (!isSurpriseRunning) return;

      if (currentRevealIndex < wordEntities.length) {
        const item = wordEntities[currentRevealIndex];
        const now = performance.now();
        item.reveal(now);

        // Update Header HUD
        currentLangBadge.textContent = `${item.lang}: "${item.text}"`;
        const percent = Math.round(((currentRevealIndex + 1) / totalWords) * 100);
        progressBar.style.width = `${percent}%`;
        progressPercent.textContent = `${percent}%`;

        // Sound & Sparkle trigger
        playWordChime(currentRevealIndex, totalWords);
        const centerX = width / 2;
        const centerY = height / 2 - 20;
        sparkles.push(new SparkleParticle(centerX + item.slotX, centerY + item.slotY, false));

        currentRevealIndex++;
        revealTimer = setTimeout(runNextReveal, speedDelay);
      } else {
        // Complete state: Formation of unified breathing heart!
        completeHeartFormation();
      }
    }

    function completeHeartFormation() {
      isCompleted = true;
      currentLangBadge.innerHTML = `<span class="text-rose-300 font-bold tracking-widest">YURAK TO'LIQ SHAKLLANDI! ❤</span>`;
      progressBar.style.width = '100%';
      progressPercent.textContent = '100%';

      // Final celebration burst of sparks from center
      const centerX = width / 2;
      const centerY = height / 2 - 20;
      for (let i = 0; i < 60; i++) {
        sparkles.push(new SparkleParticle(centerX, centerY, true));
      }
      playThumpSound();
    }

    function restartSurprise() {
      if (revealTimer) clearTimeout(revealTimer);
      initWordEntities();
      currentRevealIndex = 0;
      isCompleted = false;
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';
      currentLangBadge.textContent = "Qayta boshlanmoqda...";
      runNextReveal();
    }

    startSurpriseBtn.addEventListener('click', startSurpriseExperience);

    soundToggleBtn.addEventListener('click', () => {
      initAudio();
      isSoundMuted = !isSoundMuted;
      if (isSoundMuted) {
        soundIcon.className = 'fa-solid fa-volume-xmark text-gray-400';
      } else {
        soundIcon.className = 'fa-solid fa-volume-high text-pink-400';
      }
    });

    speedToggleBtn.addEventListener('click', () => {
      isFastSpeed = !isFastSpeed;
      if (isFastSpeed) {
        speedDelay = 140; // 3x Faster speed
        speedLabel.textContent = "Tezlik: Tez (3x)";
        speedToggleBtn.classList.add('border-rose-400', 'bg-rose-900/50');
      } else {
        speedDelay = 380; // Normal tempo
        speedLabel.textContent = "Tezlik: Normal";
        speedToggleBtn.classList.remove('border-rose-400', 'bg-rose-900/50');
      }
    });

    replayBtn.addEventListener('click', restartSurprise);

    // Name Customization Modal events
    customNameBtn.addEventListener('click', () => {
      nameModal.classList.remove('hidden');
      partnerNameInput.value = partnerName;
    });

    closeNameModal.addEventListener('click', () => nameModal.classList.add('hidden'));

    savePartnerName.addEventListener('click', () => {
      partnerName = partnerNameInput.value.trim();
      nameModal.classList.add('hidden');
      const centerX = width / 2;
      const centerY = height / 2 - 20;
      for (let i = 0; i < 35; i++) {
        sparkles.push(new SparkleParticle(centerX, centerY, true));
      }
    });

    clearPartnerName.addEventListener('click', () => {
      partnerName = "";
      partnerNameInput.value = "";
      nameModal.classList.add('hidden');
    });

    // Touch/click canvas to emit love sparks
    function onTouchCanvas(e) {
      if (!isSurpriseRunning) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      for (let i = 0; i < 15; i++) {
        sparkles.push(new SparkleParticle(clientX, clientY, true));
      }
      playWordChime(Math.floor(Math.random() * totalWords), totalWords);
    }
    canvas.addEventListener('click', onTouchCanvas);
    canvas.addEventListener('touchstart', onTouchCanvas, { passive: true });

    let beatTime = 0;
    let lastAudioThump = 0;

    function renderLoop(timestamp) {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Subtle Stardust Background
      stars.forEach(st => {
        st.alpha += st.speed;
        if (st.alpha > 0.8 || st.alpha < 0.15) st.speed = -st.speed;
        ctx.fillStyle = `rgba(255, 192, 203, ${Math.max(0, st.alpha)})`;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
        ctx.fill();
      });

      const centerX = width / 2;
      const centerY = height / 2 - 20;

      // 2. Cardiac Pulse Factor (starts gentle, beats passionately upon 100% completion)
      let pulseScale = 1;
      if (isCompleted) {
        beatTime += 0.052;
        const rawPulse = Math.sin(beatTime * 3.0);
        if (rawPulse > 0.25) {
          pulseScale = 1 + Math.pow(Math.sin((rawPulse - 0.25) / 0.75 * Math.PI), 2) * 0.15;
        }

        // Trigger organic heartbeat audio on peak
        if (rawPulse > 0.95 && Date.now() - lastAudioThump > 650) {
          lastAudioThump = Date.now();
          playThumpSound();
        }
      }

      // 3. Glowing Heart Cardioid Outline & Soft Background Aura
      if (isSurpriseRunning) {
        ctx.save();
        ctx.translate(centerX, centerY);

        // Radiant Soft Heart Aura
        const aura = ctx.createRadialGradient(0, 0, 10, 0, 0, heartScale * 22 * pulseScale);
        aura.addColorStop(0, isCompleted ? 'rgba(244, 63, 94, 0.26)' : 'rgba(244, 63, 94, 0.12)');
        aura.addColorStop(0.7, 'rgba(159, 18, 57, 0.05)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, heartScale * 24 * pulseScale, 0, Math.PI * 2);
        ctx.fill();

        // Delicate Cardioid Contour
        ctx.beginPath();
        for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.04) {
          const pt = getCardioidPoint(t, heartScale * pulseScale);
          if (t === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        ctx.strokeStyle = isCompleted ? 'rgba(251, 113, 133, 0.5)' : 'rgba(251, 113, 133, 0.22)';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = 'rgba(244, 63, 94, 0.7)';
        ctx.shadowBlur = isCompleted ? 20 : 10;
        ctx.stroke();
        ctx.restore();
      }

      // 4. Render Multilingual Love Words
      wordEntities.forEach(word => {
        word.update(timestamp);
        word.draw(ctx, centerX, centerY, pulseScale);
      });

      // 5. Centerpiece Crown: "MEN SENI SEVAMAN" & Partner Name (Beams brightly once complete)
      if (isCompleted) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const mainText = partnerName ? partnerName : "Men Seni Sevaman";
        const subText = partnerName ? "Men Seni Sevaman" : "I Love You";

        // Primary Golden-Rose Centerpiece
        const titleSize = Math.max(22, Math.min(46, heartScale * 1.8)) * pulseScale;
        ctx.font = `700 ${titleSize}px 'Dancing Script', cursive`;
        ctx.shadowColor = 'rgba(255, 60, 110, 0.95)';
        ctx.shadowBlur = 28;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(mainText, 0, -titleSize * 0.35);

        // Subtitle English/Romance text
        const subSize = Math.max(14, Math.min(26, heartScale * 1.1)) * pulseScale;
        ctx.font = `600 ${subSize}px 'Great Vibes', cursive`;
        ctx.shadowColor = 'rgba(244, 63, 94, 0.85)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#fecdd3';
        ctx.fillText(subText, 0, subSize * 0.95);

        ctx.restore();
      }

      // 6. Draw & Update Sparkle Confetti
      for (let i = sparkles.length - 1; i >= 0; i--) {
        sparkles[i].update();
        sparkles[i].draw(ctx);
        if (sparkles[i].life <= 0) {
          sparkles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    // Launch render loop on startup
    window.onload = function() {
      requestAnimationFrame(renderLoop);
    };
  </script>
</body>
</html>
